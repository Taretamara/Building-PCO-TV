plugins {
    id("com.android.application")
}

android {
    namespace "tv.pco.app"
    compileSdk 34

    defaultConfig {
        applicationId "tv.pco.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("PCO_STORE_FILE") ?: "${System.getProperty("user.home")}/.pco-android/pco-release.keystore")
            storePassword System.getenv("PCO_STORE_PASSWORD")
            keyAlias System.getenv("PCO_KEY_ALIAS") ?: "pco"
            keyPassword System.getenv("PCO_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
